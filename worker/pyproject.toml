[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synclrc-worker"
version = "3.1.0"
description = "SyncLRC Local Alignment & Transcription Worker (WhisperX + faster-whisper)"
requires-python = ">=3.10,<3.14"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
